<style>

 --accent:#c9b06e;  /* ochre khaki, a step deeper than the text boxes: fills and lines */

 --accent-t:#d6bd7a;/* same hue, light enough for text on the dark page */
 --teal:#3fbf96;    /* small blue-green accent: active section, links, hovers (on the dark page) */
 --teal-d:#167a5e;  /* same accent on the light khaki boxes */
 --on-accent:#3b372f;
 --title:#c08f3d;   /* site title: the yellow of the "I" in the original logo */

 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:24px/1.25 VT323,monospace;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent-t)}
img{-webkit-user-drag:none;user-select:none}

.sheet{background:var(--sheet);box-shadow:inset 0 0 0 2px var(--line),inset 0 -5px 0 var(--line)}

/* Header */
header{position:relative;z-index:5;background:var(--head)}
.bar{max-width:1320px;margin:0 auto;padding:10px 28px 9px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 32px}
.logo{display:flex;flex-direction:column;align-items:center;text-decoration:none}
/* Hand-drawn title, painted in one colour (the yellow of the "I") through a mask */
.logo{--th:clamp(32px,3.1vw,42px)}
.logo .title{display:block;height:var(--th);aspect-ratio:735/200;background:var(--title);
 -webkit-mask:url("images/header/title.png") center/contain no-repeat;mask:url("images/header/title.png") center/contain no-repeat}
.logo span{display:block;margin-top:calc(var(--th)*.1);font-size:calc(var(--th)*.4286);  /* keeps the subtitle as wide as the title */ line-height:1;letter-spacing:.04em;color:var(--dim)}
.tabs{display:flex;flex-wrap:wrap;gap:0 26px}
.tabs button{position:relative;background:none;border:0;color:var(--dim);font:24px/1.3 VT323,monospace;padding:2px 0 2px 16px;cursor:pointer;text-align:left}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--teal)}
.tabs button:hover::before,.tabs button.on::before{content:"▸";position:absolute;left:0}
/* Animation dropdown (like the old site): opens on hover or tap, lists the three projects */
.dd{position:relative}
.dd>button::after{content:" ▾";font-size:.8em}
.menu{display:none;position:absolute;top:100%;left:0;z-index:20;width:max-content;max-width:calc(100vw - 32px);flex-direction:column;gap:2px;padding:10px 18px 14px 14px;background:var(--khaki);box-shadow:inset 0 -5px 0 var(--khaki-d)}
.dd.open .menu{display:flex}
@media(hover:hover){.dd:hover .menu{display:flex}}
.menu button{color:#6e6248}
.menu button:hover{color:var(--dark)}.menu button.on{color:var(--teal-d)}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
[hidden]{display:none!important}

main{flex:1;max-width:1320px;width:100%;margin:0 auto;padding:34px 28px 10px}
h2{font:400 32px/1.1 VT323,monospace;color:var(--ink);margin:0 0 14px;padding-bottom:6px;border-bottom:3px solid var(--accent)}
.lbl{font-size:26px;margin:34px 0 14px;padding-bottom:4px;border-bottom:3px solid var(--accent)}

/* Galleries: big tiles in their original proportions (masonry) */
main.wide{max-width:none;padding:12px 12px 10px}
.masonry{display:flex;gap:10px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.tile{position:relative;display:block;width:100%;padding:0;background:none;border:0;cursor:zoom-in;transition:transform .2s ease}
/* Hover: grows about 2px per side (pixel corners scale with it) */
.tile:hover,.tile:focus-visible{transform:scale(1.015);z-index:1}
.tile img,.tile canvas{display:block;width:100%;height:auto;transition:filter .25s ease,opacity .4s ease}
.tile img{opacity:0}.tile img.ok{opacity:1}
.tile canvas{aspect-ratio:1;image-rendering:pixelated}
.tile img,.tile canvas{background:var(--slot)}
.tile:hover img{filter:brightness(1.05) saturate(1.05)}

/* About */
.about{display:grid;grid-template-columns:340px minmax(0,600px);gap:34px;align-items:start}
.photo{display:block;width:100%;height:auto}
.bubble{position:relative;margin-top:4px}
.bubble::before{content:"";position:absolute;left:-16px;top:0;width:16px;height:16px;background:var(--khaki);
 clip-path:polygon(0 0,100% 0,100% 100%,75% 100%,75% 75%,50% 75%,50% 50%,25% 50%,25% 25%,0 25%)}
.bubble-box{min-height:190px;padding:22px 24px 16px;background:var(--khaki);color:var(--dark);box-shadow:inset 0 -5px 0 var(--khaki-d)}
.bubble-box h2{color:var(--dark);border-color:var(--dark);border-bottom-width:2px}
.bubble-box p{margin:0 0 8px}
.logos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
/* Logo slots like the inventory slots in the reference: paper slot, logo printed in a muted ink */
.logos div{aspect-ratio:1;padding:16%;background:var(--slot);box-shadow:inset 0 0 0 2px var(--line),inset 0 -4px 0 var(--line)}
.logos span{display:block;width:100%;height:100%;background:var(--logo-ink);transition:background-color .2s;
 -webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.logos div:hover span{background:var(--dim)}

/* Contact */
h1{font:400 32px/1.1 VT323,monospace;color:var(--accent-t);margin:0 0 14px}
.say a{color:var(--teal)}
.say{max-width:760px;margin:0 0 26px;min-height:2.6em;font-size:26px;line-height:1.3}
.bubble-box p{font-size:26px;line-height:1.3}
form{display:grid;gap:12px;max-width:760px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea{width:100%;padding:12px 14px 15px;font:inherit;color:var(--dark);background:var(--khaki);border:0;box-shadow:inset 0 -5px 0 var(--khaki-d)}
input:focus,textarea:focus{outline:0;box-shadow:inset 0 -5px 0 var(--khaki-d),inset 0 0 0 3px var(--accent-t)}
textarea{height:160px;resize:vertical}
::placeholder{color:#76673f}
.btn{justify-self:start;padding:8px 22px 11px;font:24px/1.2 VT323,monospace;color:var(--on-accent);background:var(--accent);border:0;cursor:pointer;box-shadow:inset 0 -4px 0 var(--accent-d)}
.btn:hover{background:var(--accent-d)}
.btn:active{box-shadow:none;padding:10px 22px 9px}
.btn:disabled{opacity:.6;cursor:wait}
.send{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.status{margin:0;font-size:24px;color:var(--dim)}
.status.ok{color:var(--teal)}.status.err{color:#e0866a}
.status a{color:inherit}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}  /* spam trap, hidden from people */

/* Lightbox */
.lb{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:1fr auto;place-items:center;padding:20px 64px 10px;background:rgba(32,29,22,.95)}
.lb img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;will-change:opacity,transform}
.lb{animation:lbIn .2s ease-out}
@keyframes lbIn{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.lb{animation:none}}
.lb p{margin:0;color:var(--cream)}
.lb button{position:absolute;background:none;border:0;color:var(--cream);font:52px/1 VT323,monospace;cursor:pointer;padding:8px 14px}
.lb button:hover{color:var(--teal)}
.lb .x{top:6px;right:8px;font-size:40px}.lb .pv{left:4px;top:50%;transform:translateY(-50%)}.lb .nx{right:4px;top:50%;transform:translateY(-50%)}

/* Footer */
footer{text-align:center;padding:56px 16px 24px;color:var(--dim);font-size:20px}
.soc{display:flex;justify-content:center;gap:6px}
.soc a{display:grid;place-items:center;padding:6px;color:var(--dim);transition:color .2s}
.soc a:hover{color:var(--teal)}
.soc svg{width:15px;height:15px;shape-rendering:crispEdges}
footer p{margin:10px 0 0}

@media(min-width:861px){header{position:sticky;top:0}}
/* Mobile menu: pixel button like the text boxes, opens a khaki panel (hidden on desktop) */
.burger,.mnav{display:none}
.burger{width:46px;height:44px;padding:0;place-items:center;border:0;cursor:pointer;background:var(--khaki);box-shadow:inset 0 -4px 0 var(--khaki-d)}
.burger i{display:block;width:20px;height:3px;margin-top:-2px;background:var(--dark);box-shadow:0 -7px 0 var(--dark),0 7px 0 var(--dark)}
.burger[aria-expanded="true"]{background:var(--khaki-d);box-shadow:inset 0 4px 0 #b9a571}
.mnav{position:absolute;top:calc(100% - 4px);right:16px;z-index:30;min-width:250px;max-width:calc(100vw - 32px);padding:12px 18px 16px 12px;background:var(--khaki);box-shadow:inset 0 -5px 0 var(--khaki-d);flex-direction:column}
.mnav button{position:relative;background:none;border:0;text-align:left;color:#6e6248;font:24px/1.3 VT323,monospace;padding:5px 0 5px 18px;cursor:pointer}
.mnav button:hover{color:var(--dark)}.mnav button.on{color:var(--teal-d)}
.mnav button:hover::before,.mnav button.on::before{content:"▸";position:absolute;left:2px}
.mnav .grp{color:#8f8264;font-size:24px;padding:5px 0 1px 18px}
.mnav .sub{padding-left:36px}.mnav .sub:hover::before,.mnav .sub.on::before{left:20px}
/* Mobile galleries: square previews in a tight grid, more pieces per screen */
.squares{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.squares .tile img{aspect-ratio:1;object-fit:cover}
@media(max-width:860px){
 .tabs{display:none}
 .burger{display:grid}
 .mnav:not([hidden]){display:flex}
 .bar{flex-wrap:nowrap}
 .about{grid-template-columns:1fr;gap:26px}
 .photo{max-width:420px}
 .bubble{margin-top:16px}
 .bubble::before{left:28px;top:-16px;clip-path:polygon(0 0,25% 0,25% 25%,50% 25%,50% 50%,75% 50%,75% 75%,100% 75%,100% 100%,0 100%)}
 .two{grid-template-columns:1fr}
 .bar{padding:9px 16px 8px}
 .logo{--th:32px}
 .burger{width:42px;height:40px}
 main{padding:24px 16px 10px}
 .logos{gap:8px}
 .lb{padding:16px 8px 10px}.lb .pv,.lb .nx{top:auto;bottom:0;transform:none}
}
@media(prefers-reduced-motion:reduce){.tile,.tile img,.soc a{transition:none}.tile:hover,.tile:focus-visible{transform:none}}

<script>
const TABS=[['characters','Characters'],['world-building','World Building'],['animation','Animation'],['about','About'],['contact','Contact']];
const SUBS=[['advertising','Advertising'],['wolfboy','Wolfboy & The Everything Factory'],['house-broken','House Broken']];
const KIND={'home':'Artwork','animation':'Animation','characters':'Character','world-building':'World Building','advertising':'Advertising','wolfboy':'Wolfboy','house-broken':'House Broken'};
const DATA=window.GALLERIES||{};
const EMAIL='mrpigodoy@gmail.com';
/* Contact form delivery: paste the Formspree form URL here (https://formspree.io/f/xxxxxxx).
   While it is empty, "Send Message" opens the visitor's mail app instead. */
const FORM_ENDPOINT='https://formspree.io/f/xvkapkzd';
const tabs=document.getElementById('tabs'),view=document.getElementById('view');
const narrow=matchMedia('(max-width:860px)'),hoverable=matchMedia('(hover:hover)');
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* Image protection (good-faith signal only) */
addEventListener('contextmenu',e=>{if(e.target.tagName==='IMG')e.preventDefault()});
addEventListener('dragstart',e=>{if(e.target.tagName==='IMG')e.preventDefault()});

const el=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const img=(src,alt)=>{const i=el('img');i.src=src;i.alt=alt||'';i.draggable=false;return i};
const pad=n=>String(n).padStart(2,'0');

/* Pixel icons, 11x11, '#' = filled pixel */
const X11=Array.from({length:11},(_,r)=>Array.from({length:11},(_,c)=>(c===r||c===r+1||c===10-r)?'#':'.').join(''));
const ICONS={
 X:X11,
 Facebook:['...........','.....####..','....#####..','....##.....','..#######..','....##.....','....##.....','....##.....','....##.....','....##.....','...........'],
 Instagram:['.#########.','#.........#','#.......#.#','#...###...#','#..#...#..#','#..#...#..#','#..#...#..#','#...###...#','#.........#','#.........#','.#########.'],
 LinkedIn:['...........','.##........','.##........','...........','.##.#####..','.##.##..##.','.##.##..##.','.##.##..##.','.##.##..##.','.##.##..##.','...........']
};
function pixelIcon(rows){
 let d='';rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='#')d+=`M${x} ${y}h1v1h-1z`}));
 return `<svg viewBox="0 0 11 11" aria-hidden="true"><path fill="currentColor" d="${d}"/></svg>`;
}
const SOCIAL=[['X','https://twitter.com/_MrPG'],['Facebook','https://www.facebook.com/mrpgodoy/'],['Instagram','https://www.instagram.com/_mr.pi/'],['LinkedIn','https://www.linkedin.com/in/fran-godoy-a3a518220/']];
document.getElementById('soc').innerHTML=SOCIAL.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener" aria-label="${n}" title="${n}">${pixelIcon(ICONS[n])}</a>`).join('');

/* Placeholder sprites for sections without real images yet */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sprite(seed){
 const pal=['#e3a14a','#e2d2a0','#a89c6c','#2a251b'],r=rng(seed*7919+13),m=[],c=document.createElement('canvas');c.width=c.height=10;const x=c.getContext('2d');
 for(let y=0;y<8;y++){m[y]=[];for(let i=0;i<4;i++){const v=r()<.35+.15*i-.07*Math.abs(y-3.5)?Math.floor(r()*3):-1;m[y][i]=v;m[y][7-i]=v}}
 const f=(X,Y)=>X>=0&&X<8&&Y>=0&&Y<8&&m[Y][X]>=0;
 for(let y=0;y<8;y++)for(let i=0;i<8;i++){if(f(i,y)){x.fillStyle=pal[m[y][i]];x.fillRect(i+1,y+1,1,1)}else if(f(i+1,y)||f(i-1,y)||f(i,y+1)||f(i,y-1)){x.fillStyle=pal[3];x.fillRect(i+1,y+1,1,1)}}
 return c;
}

/* Typewriter: reveals every text node inside root, in order (links included) */
function typewrite(root,speed=22){
 if(calm)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(w.nextNode())nodes.push([w.currentNode,w.currentNode.textContent]);
 nodes.forEach(([n])=>n.textContent='');
 let i=0,c=0;
 const iv=setInterval(()=>{
  if(!root.isConnected||i>=nodes.length)return clearInterval(iv);
  const [n,full]=nodes[i];n.textContent=full.slice(0,++c);
  if(c>=full.length){i++;c=0}
 },speed);
}

/* Lightbox */
function lightbox(items,start,label){
 let i=start;const box=el('div','lb'),pic=img(''),cap=el('p'),prev=document.activeElement;
 box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label',label);

 x.setAttribute('aria-label','Close');pv.setAttribute('aria-label','Previous');nx.setAttribute('aria-label','Next');
 /* Subtle transition: the current piece slides a little and fades out, the next one slides in from the other side */
 const anim=(k,o)=>calm||!pic.animate?Promise.resolve():pic.animate(k,o).finished.catch(()=>{});
 let busy=0;
 const preload=n=>{const j=(n+items.length)%items.length,p=new Image();p.src=items[j].src+'.jpg'};
 const show=(d=0)=>{
  const t=++busy,src=items[i].src+'.jpg';
  cap.textContent=pad(i+1)+' / '+pad(items.length);
  const swap=()=>{if(t!==busy)return;
   pic.onload=pic.onerror=()=>{if(t!==busy)return;pic.style.opacity='';anim([{opacity:0,transform:`translateX(${d*28}px) scale(${d?1:.97})`},{opacity:1,transform:'none'}],{duration:d?280:240,easing:'cubic-bezier(.2,.7,.3,1)'})};
   if(pic.src.endsWith(src))return pic.onload();
   pic.src=src;pic.alt=label+' '+pad(i+1)};
  if(d&&pic.src){anim([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-d*20}px)`}],{duration:140,easing:'ease-in'}).then(()=>{if(t===busy){pic.style.opacity='0';swap()}})}
  else{pic.style.opacity='0';swap()}
  preload(i+1);preload(i-1);
 };
 const go=d=>{i=(i+d+items.length)%items.length;show(d)};
 const close=()=>{box.remove();removeEventListener('keydown',key);document.body.style.overflow='';prev&&prev.focus()};
 const key=e=>{if(e.key==='Escape')close();if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)};
 x.onclick=close;pv.onclick=()=>go(-1);nx.onclick=()=>go(1);
 box.onclick=e=>{if(e.target===box)close()};
 let sx=null;box.ontouchstart=e=>sx=e.touches[0].clientX;box.ontouchend=e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1);sx=null};
 box.append(pic,cap,x,pv,nx);document.body.appendChild(box);document.body.style.overflow='hidden';
 addEventListener('keydown',key);show();x.focus();
}

/* Gallery: masonry that keeps the reading order left to right */
function gallery(id){
 const items=DATA[id]||[],real=items.length>0,kind=KIND[id];
 const wrap=el('div','masonry'),tiles=[],ratios=[],imgs=[];
 const n=real?items.length:12;
 for(let i=0;i<n;i++){
  const b=el('button','tile');b.setAttribute('aria-label',kind+' '+pad(i+1));
  if(real){
   const it=items[i],t=img(it.src+'-md.jpg',kind+' '+pad(i+1));
   t.width=1100;t.height=Math.round(1100*it.h/it.w);t.loading='lazy';t.decoding='async';t.onload=()=>t.classList.add('ok');if(t.complete)t.classList.add('ok');
   const chip=i%5===2?'chip-t':i%7===4?'chip-r':i%6===5?'chip-b':i%11===8?'chip-l':'';if(chip)t.classList.add(chip);
   b.appendChild(t);b.onclick=()=>lightbox(items,i,kind);ratios.push(it.h/it.w);imgs[i]=t;
  }else{b.appendChild(sprite(i+id.length*31));b.style.cursor='default';ratios.push(1)}
  tiles.push(b);
 }
 let mode='';
 /* Phones get small square previews (more pieces per screen); larger screens get the masonry */
 const useSrc=size=>imgs.forEach((t,i)=>{const want=items[i].src+size;if(!t.src.endsWith(want)){t.classList.remove('ok');t.src=want}});
 const layout=()=>{
  if(narrow.matches){
   if(mode==='sq')return;mode='sq';
   wrap.className='squares';useSrc('-sm.jpg');wrap.replaceChildren(...tiles);return;
  }
  const w=wrap.clientWidth||innerWidth,c=w>=1500?5:w>=1150?4:w>=800?3:w>=480?2:1;
  if(mode===String(c))return;mode=String(c);
  wrap.className='masonry';useSrc('-md.jpg');
  const colEls=Array.from({length:c},()=>el('div','col')),h=new Array(c).fill(0);
  tiles.forEach((t,i)=>{const k=h.indexOf(Math.min(...h));colEls[k].appendChild(t);h[k]+=ratios[i]+.03});
  wrap.replaceChildren(...colEls);
 };
 new ResizeObserver(layout).observe(wrap);
 layout();
 return wrap;
}

function about(){
 const A=DATA.about||{},w=el('div','about');
 const card=A.photo?img(A.photo,'Fran Godoy'):sprite(404);
 card.className='photo chip-b';
 const right=el('div'),bubble=el('div','bubble'),box=el('div','bubble-box chip-t');
 box.innerHTML='<h2>Hey!</h2><p>I’m Fran, concept and visual development artist in the animation and video games industry.</p><p>Thanks for stopping by,</p><p>Cheers!</p>';
 bubble.appendChild(box);right.appendChild(bubble);
 if(A.logos&&A.logos.length){
  right.appendChild(el('div','lbl','Worked with'));
  const g=el('div','logos');A.logos.forEach((s,i)=>{const d=el('div',i===2?'chip-t':i===5?'chip-l':null);const m=el('span');m.style.setProperty('--src',`url("${s}")`);d.appendChild(m);g.appendChild(d)});
  right.appendChild(g);
 }
 w.append(card,right);typewrite(box,11);return w;
}

function contact(){
 const f=el('div'),say=el('p','say');
 f.appendChild(el('h1',null,'Get in touch'));
 say.append('For inquiries or just to say hi contact me here or email me at: ');
 const a=el('a',null,EMAIL);a.href='mailto:'+EMAIL;say.appendChild(a);
 f.appendChild(say);typewrite(say);
 const form=el('form');
 form.innerHTML='<div class="two"><input name="name" placeholder="Name" aria-label="Name" autocomplete="name" required><input name="email" type="email" placeholder="Email" aria-label="Email" autocomplete="email" required></div><textarea class="chip-r" name="message" placeholder="Message" aria-label="Message" required></textarea>'
  +'<input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">'
  +'<div class="send"><button class="btn" type="submit">Send Message</button><p class="status" role="status" aria-live="polite"></p></div>';
 const status=form.querySelector('.status'),btn=form.querySelector('.btn');
 const v=n=>form.elements[n].value;
 const mailto=()=>location.href='mailto:'+EMAIL+'?subject='+encodeURIComponent('Portfolio inquiry from '+v('name'))+'&body='+encodeURIComponent(v('message')+'\n\n'+v('name')+' ('+v('email')+')');
 form.onsubmit=async e=>{
  e.preventDefault();
  if(!FORM_ENDPOINT)return mailto();   /* no Formspree form yet: open the visitor's mail app */
  btn.disabled=true;btn.textContent='Sending…';status.className='status';status.textContent='';
  try{
   const data=new FormData(form);data.append('_subject','Portfolio inquiry from '+v('name'));
   const r=await fetch(FORM_ENDPOINT,{method:'POST',body:data,headers:{Accept:'application/json'}});
   if(!r.ok)throw new Error(r.status);
   form.reset();status.className='status ok';status.textContent='Thanks! Your message is on its way.';
  }catch(err){
   status.className='status err';status.innerHTML='';
   status.append('Something went wrong. Please email me at ');const a=el('a',null,EMAIL);a.href='mailto:'+EMAIL;status.append(a,'.');
  }finally{btn.disabled=false;btn.textContent='Send Message'}
 };
 f.appendChild(form);return f;
}

function route(){
 let id=location.hash.slice(1);
 /* Home is the landing page (no menu item, reached through MISTER PI); Animation has its own overview page */
 if(!(id in KIND||id==='about'||id==='contact'))id='home';
 const sub=SUBS.some(s=>s[0]===id);
 tabs.replaceChildren(...TABS.map(([h,l])=>{
  const b=el('button',(h===id||(h==='animation'&&sub))?'on':'',l);
  if(h!=='animation'){b.onclick=()=>location.hash=h;return b}
  /* Animation: click opens the overview; the projects are in the dropdown (hover on desktop).
     On touch screens without hover, the first tap opens the dropdown and a second tap opens the overview. */
  const dd=el('div','dd'),menu=el('div','menu');
  b.setAttribute('aria-haspopup','true');b.setAttribute('aria-expanded','false');
  b.onclick=e=>{e.stopPropagation();
   if(hoverable.matches){dd.classList.remove('open');location.hash='animation';return}
   if(dd.classList.contains('open')){dd.classList.remove('open');location.hash='animation';return}   /* touch: 2nd tap opens the overview */
   dd.classList.add('open');b.setAttribute('aria-expanded','true')};
  SUBS.forEach(([sh,sl])=>{const s=el('button',sh===id?'on':'',sl);s.onclick=()=>{dd.classList.remove('open');location.hash=sh};menu.appendChild(s)});
  dd.append(b,menu);return dd;
 }));
 /* Mobile panel: same sections; "Animation" opens the overview and its projects are listed under it */
 const mb=(h,l,cls)=>{const b=el('button',(cls||'')+(h===id?' on':''),l);b.onclick=()=>{setMenu(false);location.hash=h};return b};
 mnav.replaceChildren(...TABS.flatMap(([h,l])=>h!=='animation'?[mb(h,l)]:[mb('animation',l),...SUBS.map(([sh,sl])=>mb(sh,sl,'sub'))]));
 setMenu(false);
 view.classList.toggle('wide',id in KIND);
 view.replaceChildren(id==='about'?about():id==='contact'?contact():gallery(id));
 document.title='Mister Pi – '+(TABS.concat(SUBS).find(t=>t[0]===id)||[0,'Fran Godoy Portfolio'])[1];
 scrollTo(0,0);
}
const burger=document.getElementById('burger'),mnav=document.getElementById('mnav');
function setMenu(open){mnav.hidden=!open;burger.setAttribute('aria-expanded',open)}
burger.onclick=e=>{e.stopPropagation();setMenu(mnav.hidden)};
addEventListener('click',e=>{if(!mnav.hidden&&!e.target.closest('#mnav'))setMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!mnav.hidden){setMenu(false);burger.focus()}});
addEventListener('hashchange',route);route();
/* Close the Animation dropdown on outside click or Escape */
const closeMenu=()=>{const d=document.querySelector('.dd.open');if(d){d.classList.remove('open');d.firstChild.setAttribute('aria-expanded','false')}};
addEventListener('click',e=>{if(!e.target.closest('.dd'))closeMenu()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
</script>
